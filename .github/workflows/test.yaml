on: [push]

jobs:
  hello_world_job:
    runs-on: ubuntu-latest
    name: A job to say hello
    steps:
      - name: Hello world action step
        id: hello
        uses: "cloudsftp/nested-action-example/nested@latest"
        with:
          who-to-greet: "Clouds"
      - name: Get the output time
        run: echo "The time was ${{ steps.hello.outputs.time }}"
